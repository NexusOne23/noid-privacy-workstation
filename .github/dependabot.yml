version: 2

updates:
  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - ci
      - dependencies

  # Note: uBO XPI and non-GitHub package inputs follow the reviewed manual
  # pin/signature workflows. Dependabot does not currently track those; see
  # docs/release-process.md.
  # arkenfox absorbed — no longer external dep
  # (consolidated into firefox/noid-firefox-hardening.js, regen via
  # scripts/regen-firefox-embed.sh). HorlogeSkynet TB user.js similarly
  # absorbed in M35 — see thunderbird/noid-thunderbird-hardening.js
  # + scripts/regen-thunderbird-embed.sh.
