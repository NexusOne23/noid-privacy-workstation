version: 2

updates:
  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - ci
      - dependencies

  # Note: uBO XPI and non-GitHub package inputs follow the reviewed manual
  # pin/signature workflows. Dependabot does not track those; see
  # docs/pin-inventory.md.
